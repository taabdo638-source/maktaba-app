name: Build Maktaba App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller Pillow

      - name: Build executable
        run: pyinstaller --onefile --windowed --name "نظام_المكتبة" --collect-all PIL --collect-all customtkinter --hidden-import PIL._tkinter_finder maktaba_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: نظام_المكتبة-windows
          path: dist/*.exe
