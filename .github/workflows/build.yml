@echo off
chcp 65001 >nul
echo ============================================
echo   بناء برنامج نظام المكتبة كملف تنفيذي (exe)
echo ============================================
echo.
echo [1/3] تحديث pip...
python -m pip install --upgrade pip

echo.
echo [2/3] تثبيت المكتبات المطلوبة...
python -m pip install customtkinter pyinstaller Pillow

echo.
echo [3/3] بناء البرنامج التنفيذي...
pyinstaller --onefile --windowed --name "نظام_المكتبة" --collect-all PIL --collect-all customtkinter --hidden-import PIL._tkinter_finder maktaba_app.py

echo.
echo ============================================
echo   تم الانتهاء بنجاح!
echo   ستجد البرنامج الجاهز داخل مجلد "dist"
echo   باسم: نظام_المكتبة.exe
echo ============================================
pause

name: بناء برنامج نظام المكتبة

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller Pillow

      - name: بناء الملف التنفيذي
        run: >
          pyinstaller --onefile --windowed --name "نظام_المكتبة"
          --collect-all PIL
          --collect-all customtkinter
          --hidden-import PIL._tkinter_finder
          maktaba_app.py

      - name: رفع الملف الجاهز
        uses: actions/upload-artifact@v4
        with:
          name: نظام_المكتبة-windows
          path: dist/*.exe
